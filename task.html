<!DOCTYPE html>
<html lang="zh-Hant-TW">
	<head>
        <meta charset="UTF-8">
        <title>LABT 測驗</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="css/task.css" rel="stylesheet">
        <script src="js/task.js" defer></script>
    </head>

    <body>
    	<main>
            <div id="task-screen">
                <!-- 第 1 回合 -->
                <!-- 資料上傳中，請稍候…… -->
                <!-- 任務已完成<br>準備進入下一階段 -->
                <div id="message"></div>
                <div id="fixation">+</div>

                <div id="word-pairs">
                    <div class="pair-row">
                        <span></span>
                        <span>-</span>
                        <span></span>
                    </div>

                    <div class="pair-row">
                        <span></span>
                        <span>-</span>
                        <span></span>
                    </div>
                    
                    <div class="pair-row">
                        <span></span>
                        <span>-</span>
                        <span></span>
                    </div>

                    <div class="pair-row">
                        <span></span>
                        <span>-</span>
                        <span></span>
                    </div>
                </div>

                <div id="single-word"></div>

                <div id="multiple-choice-question" class="active">
                    <p id="question-text">
                        請選出與「<span id="question-word"></span>」正確配對的詞語。
                    </p>
                    
                    <div id="options">
                        <button class="option">椅子</button>
                        <button class="option">椅子</button>
                        <button class="option">椅子</button>
                    </div>
                </div>
            </div>
        </main>
    </body>
</html>
